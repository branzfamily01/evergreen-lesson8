name: Fix Evergreen Lesson8 audio leak

on:
  push:
    paths:
      - '.github/workflows/fix-audio-leak.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch answer-leaking audio buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app-main.js')
          s = p.read_text(encoding='utf-8')
          old1 = '''<div class="card-actions">${audioButton(q.full)}<button class="reveal-btn">'''
          new1 = '''<div class="card-actions">${audioButton(q.en.replace(/\(\s*\)/g, 'blank'))}<button class="reveal-btn">'''
          old2 = '''<div class="q-en">${q.prompt}</div>${audioButton(q.answer)}<div class="choices">'''
          new2 = '''<div class="q-en">${q.prompt}</div>${audioButton(q.prompt)}<div class="choices">'''
          assert s.count(old1) == 1, f'EX1 target count={s.count(old1)}'
          assert s.count(old2) == 1, f'EX2 target count={s.count(old2)}'
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
          grep -F "audioButton(q.en.replace(/\\(\\s*\\)/g, 'blank'))" app-main.js
          grep -F '${audioButton(q.prompt)}' app-main.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-main.js
          git commit -m 'Fix answer-leaking question audio' || exit 0
          git push
